name: CD - Vercel Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cd-vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-frontend:
    name: Deploy frontend
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Check required secrets
        id: secrets_check
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping frontend deploy: missing Vercel secrets."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  deploy-backend:
    name: Deploy backend
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Check required secrets
        id: secrets_check
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Skipping backend deploy: missing Vercel secrets."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: npm i -g vercel@latest

      - name: Pull Vercel environment
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build project artifacts
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to production
        if: ${{ steps.secrets_check.outputs.should_deploy == 'true' }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
