<section class="space-y-6">
  <div class="glass-panel p-8">
    <h1 class="text-3xl font-black tracking-tight text-slate-900">Trainer Dashboard</h1>
    <p class="mt-2 text-sm text-slate-600">
      Protected route: only authenticated users can access this page.
    </p>
  </div>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
    <article class="glass-panel p-5">
      <h2 class="text-sm font-semibold text-slate-500">Trainer</h2>
      <p class="mt-1 text-lg font-bold text-slate-900">{{ user()?.username }}</p>
    </article>
    <article class="glass-panel p-5">
      <h2 class="text-sm font-semibold text-slate-500">Rating</h2>
      <p class="mt-1 text-lg font-bold text-slate-900">{{ user()?.rating }}</p>
    </article>
    <article class="glass-panel p-5">
      <h2 class="text-sm font-semibold text-slate-500">Level</h2>
      <p class="mt-1 text-lg font-bold text-slate-900">{{ user()?.level }}</p>
    </article>
    <article class="glass-panel p-5">
      <h2 class="text-sm font-semibold text-slate-500">Coins</h2>
      <p class="mt-1 text-lg font-bold text-slate-900">{{ user()?.coins }}</p>
    </article>
    <article class="glass-panel p-5">
      <h2 class="text-sm font-semibold text-slate-500">Gems</h2>
      <p class="mt-1 text-lg font-bold text-slate-900">{{ user()?.gems }}</p>
    </article>
    <article class="glass-panel p-5">
      <h2 class="text-sm font-semibold text-slate-500">Shards</h2>
      <p class="mt-1 text-lg font-bold text-slate-900">{{ user()?.shards }}</p>
    </article>
  </div>
</section>
