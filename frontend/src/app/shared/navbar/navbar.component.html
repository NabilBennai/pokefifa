<nav class="sticky top-0 z-50 border-b border-white/60 bg-white/70 backdrop-blur-xl">
  <div class="mx-auto flex w-full max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <a
      routerLink="/"
      class="inline-flex items-center gap-3 text-lg font-semibold tracking-tight text-slate-900"
    >
      <span
        class="inline-flex size-9 items-center justify-center rounded-xl bg-gradient-to-br from-brand-500 to-brand-700 text-sm font-black text-white"
      >
        PF
      </span>
      Pokefifa
    </a>

    <button
      type="button"
      class="inline-flex items-center rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 md:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle navigation"
    >
      Menu
    </button>

    <div class="hidden items-center gap-2 md:flex">
      <a
        routerLink="/"
        routerLinkActive="bg-brand-100 text-brand-800"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
      >
        Home
      </a>

      @if (isAuthenticated()) {
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-brand-100 text-brand-800"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          Dashboard
        </a>
        <span class="mx-2 text-sm text-slate-600">Hi, {{ user()?.username }}</span>
        <button
          type="button"
          class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700"
          (click)="logout()"
        >
          Logout
        </button>
      } @else {
        <a
          routerLink="/login"
          routerLinkActive="bg-brand-100 text-brand-800"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 transition hover:bg-slate-100"
        >
          Login
        </a>
        <a
          routerLink="/register"
          class="rounded-lg bg-brand-600 px-4 py-2 text-sm font-semibold text-white transition hover:bg-brand-700"
        >
          Register
        </a>
      }
    </div>
  </div>

  @if (menuOpen()) {
    <div class="border-t border-white/70 bg-white/80 px-4 py-4 md:hidden">
      <div class="flex flex-col gap-2">
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="bg-brand-100 text-brand-800"
          class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
          (click)="closeMenu()"
        >
          Home
        </a>
        @if (isAuthenticated()) {
          <a
            routerLink="/dashboard"
            routerLinkActive="bg-brand-100 text-brand-800"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
            (click)="closeMenu()"
          >
            Dashboard
          </a>
          <span class="px-3 py-1 text-sm text-slate-600">Logged in as {{ user()?.username }}</span>
          <button
            type="button"
            class="rounded-lg bg-slate-900 px-3 py-2 text-left text-sm font-semibold text-white"
            (click)="logout()"
          >
            Logout
          </button>
        } @else {
          <a
            routerLink="/login"
            routerLinkActive="bg-brand-100 text-brand-800"
            class="rounded-lg px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100"
            (click)="closeMenu()"
          >
            Login
          </a>
          <a
            routerLink="/register"
            class="rounded-lg bg-brand-600 px-3 py-2 text-sm font-semibold text-white"
            (click)="closeMenu()"
          >
            Register
          </a>
        }
      </div>
    </div>
  }
</nav>
